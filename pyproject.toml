[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.wallet_apple_vas_web_service"
version = "1.1.0.dev0"
description = "Apple Wallet web service: pass registration, update lists and pass delivery"
keywords = ["wallet", "apple", "web update service"]
readme = "README.md"
authors = [
    { name = "Philipp Auersperg-Castell", email = "phil@bluedynamics.com" },
    { name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de" },
]
# 3.13, matching edutap.data_provider. The floor was ">=3.10" with classifiers
# stopping at 3.12; 3.10 reaches end of life in October 2026 and a service should
# not start its rework on an interpreter that outlives it by months.
requires-python = ">=3.13"
license = "EUPL-1.2"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

# Exact pins, because this is a service rather than a library. A library states the
# range it works with and lets the application resolve; an application decides, and
# what it decided is what has to reach the cluster. Unpinned is how this service
# broke: `edutap.wallet_apple` was named without a version, the image build pulled
# whatever was current, and the class this package imports had been renamed twenty
# months earlier. A deploy must roll out what was decided, not what happened to be
# newest on the day the build ran.
#
# Raising a pin is therefore a reviewed change, and Renovate proposes them one at a
# time — see renovate.json5.
dependencies = [
    # No `dotenv` extra: that was pydantic v1. In v2 the .env handling moved to
    # pydantic-settings below, and uv warns that the extra does not exist.
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlmodel==0.0.39",
    "psycopg2-binary==2.9.12",
    # Pinned to the release on PyPI, not to the git default branch. The Dockerfile
    # used to install this straight from `main`, which is what made every rebuild a
    # different image.
    "edutap.wallet_apple==1.0.0a5",
    "requests==2.34.2",
]

[project.optional-dependencies]
# Runtime extras: what a deployment chooses, and therefore genuinely optional
# dependencies rather than a dependency group. `fastapi` and `sql` are both required
# in practice -- the Dockerfile installs them -- but they stay selectable because the
# package is also importable as a library.
fastapi = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
]
kafka = [
    "aiokafka==0.14.0",
]
sql = [
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "sqlmodel==0.0.39",
]

# How `edutap.db_definitions` finds this package's tables. Several packages share
# one database; the tool scans this entry point to check them against each other
# for colliding names and for types left to `search_path`.
#
# It is a *development* dependency and never a runtime one -- `dbdef.py` guards
# the import so a deployment without the tool imports cleanly.
[project.entry-points."edutap.db_definitions"]
schema = "edutap.wallet_apple_vas_web_service.dbdef:definition"

# PEP 735 rather than an extra: development tooling is nothing a consumer of this
# package can select, and an extra would publish it in the package metadata. Install
# with `uv pip install -e . --group dev`, which is what the Makefile and CI do.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "requests-mock==1.12.1",
    # Pinned tightly on purpose: a ruff minor release changes what the linter reports
    # and reformats files that were correct yesterday. That is a decision, not a bump.
    "ruff==0.16.3",
    "ty==0.0.72",
    "pdbp==1.8.2",
    # fastapi.testclient needs an HTTP client; without one the API tests cannot run.
    "httpx==0.28.1",
]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.wallet_apple_vas_web_service"
Issues = "https://github.com/edutap-collective/edutap.wallet_apple_vas_web_service/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_wallet_apple_vas_web_service/index.html"

[project.scripts]
web_service = "edutap.wallet_apple_vas_web_service.standalone:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a PostgreSQL database (WALLET_APPLE_VAS_WEB_SERVICE_TEST_DSN)",
]
# The database-backed tests are excluded by default and run in their own CI job.
# Without this, a plain `pytest` fails on any machine without PostgreSQL, and a suite
# that fails for environmental reasons is a suite nobody runs.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# The same set as edutap.data_provider. `N` (pep8-naming) is deliberately absent:
# the Apple web service protocol dictates camelCase -- deviceLibraryIdentifier,
# passTypeIdentifier, serialNumber are what the device sends and what the JSON
# carries -- and renaming them would mean translating on every boundary.
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = [
    "D203",
    "D213",
    # `Depends(...)` in a parameter default is how FastAPI declares a dependency --
    # the framework evaluates it per request, not once at import. B008 is right about
    # plain Python and wrong about every FastAPI endpoint in this package.
    "B008",
    # The docstring STYLE rules are off; the docstring PRESENCE rules (D1xx) stay on.
    #
    # The endpoint docstrings quote Apple's web service reference -- the request and
    # response shapes, the status codes, the parameter descriptions. That text is a
    # primary source, and the value of having it here is that it says what Apple says.
    # Rules that demand a trailing period, an imperative summary or a particular blank
    # line would have us reword it, and a reworded quotation is worth less than the
    # quotation. Where the wording is ours we still write it properly; that is a
    # matter of care rather than of a linter.
    "D205",
    "D212",
    "D400",
    "D401",
    "D415",
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: the fixtures assign literal tokens, which is what a test of an
# authentication check has to do. S605: the pass-inspection tests shell out to open a
# generated .pkpass; that is their point.
"tests/*" = ["D", "S101", "S105", "S106", "S605"]
