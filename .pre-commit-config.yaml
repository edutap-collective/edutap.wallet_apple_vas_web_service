# One tool where there were five. ruff replaces pyupgrade, isort, black and flake8;
# ty replaces mypy and runs from the dev group rather than from a mirror repository
# with its own duplicated dependency list.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # This repository shipped a working authentication token and a database
      # password in its source; both are gone, and this keeps the next one out.
      - id: detect-private-key
