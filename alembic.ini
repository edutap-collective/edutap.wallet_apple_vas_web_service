# Alembic configuration for edutap.wallet_apple_vas_web_service.
#
# The package owns the `wallet_apple_vas` schema of a database it shares with
# the other eduTAP services. Everything that follows from that -- which schemas
# to touch, where the migration history lives -- is decided in migrations/env.py,
# which reads it from the package's own dbdef module. None of it is repeated
# here.

[alembic]
# Path to the migration scripts, relative to this file.
script_location = %(here)s/migrations

# Prepended to sys.path so `alembic` run from the repository root finds a
# source checkout that is not installed.
prepend_sys_path = .

path_separator = os

# Prefix the file name with the revision number, so `versions/` reads in the
# order the migrations run in.
file_template = %%(rev)s_%%(slug)s

# The database URL is deliberately NOT set here.
#
# env.py takes it from this file when it carries one -- which is how the test
# suite points Alembic at its container -- and otherwise from the package's own
# DatabaseSettings, i.e. from the same EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_*
# environment the service is configured with. A placeholder URL here would
# shadow that fallback and connect the migration to `driver://user:pass@localhost`
# instead.
#
# sqlalchemy.url =


[post_write_hooks]
# Format every generated revision, so an autogenerated file does not fail the
# lint that every hand-written file has to pass.
hooks = ruff_format ruff_check

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME


# Logging. Consumed by env.py via fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
