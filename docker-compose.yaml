version: "3"

services:

  # FastAPI server handling the callback
  apple-wallet-vas-web-service:
    container_name: apple-wallet-vas-web-service
    dns:
      ${DNS:-8.8.8.8}
    # image: ghcr.io/edutap-eu/edutap.wallet_apple_vas_web_service:latest
    build:
      context: .
      args:
        - HTTP_PORT=${HTTP_PORT:-80}
        - BROKER_URL=${BROKER_URL:-kafka:19094}
    ports:
      - "${HTTP_PORT:-8084}:${HTTP_PORT:-80}"
    volumes:
      - "./logs:/var/log/wallet_apple_vas_web_service"
    environment:
      - EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_HOST=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_HOST}
      - EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_NAME=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_NAME}
      - EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_USERNAME=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_USERNAME}
      - EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_PASSWORD=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apple-wallet-vas-web-service.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.routers.apple-wallet-vas-web-service.entrypoints=websecure"
      - "traefik.http.routers.apple-wallet-vas-web-service.entrypoints=https"
      - "traefik.http.routers.apple-wallet-vas-web-service.tls=true"
      - "traefik.http.routers.apple-wallet-vas-web-service.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.apple-wallet-vas-web-service.tls.certresolver=le"

  apple-wallet-vas-web-service-db:
    container_name: apple-wallet-vas-web-service-db
    image: "postgres:latest"
    restart: always
    ports:
     - '5432:5432'
    volumes:
      - ./db/data/wallet_apple_vas_web_service:/var/lib/postgresql/data
      - ./db/import:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_NAME}
      - POSTGRES_USER=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD=${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_PASSWORD}

  pgadmin:
      container_name: pgadmin4_container
      image: dpage/pgadmin4
      restart: always
      environment:
        - TOOLS_PASSWORD=${TOOLS_PASSWORD:-password}
        - PGADMIN_DEFAULT_EMAIL=${TOOLS_USERNAME}@edutap.eu
        - PGADMIN_DEFAULT_PASSWORD=${TOOLS_PASSWORD:-password}
        - SCRIPT_NAME=/pgadmin
        - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
      ports:
        - "5050:80"
      deploy:
        placement:
          constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgadmin4_container.rule=Host(`${DOMAIN}`) && PathPrefix(`/pgadmin`)"
        - "traefik.http.routers.pgadmin4_container.entrypoints=websecure"
        - "traefik.http.routers.pgadmin4_container.entrypoints=https"
        - "traefik.http.routers.pgadmin4_container.tls=true"
        - "traefik.http.routers.pgadmin4_container.tls.certresolver=le"
      volumes:
        - "./pgadmin/servers.json://pgadmin4/servers.json"

      command:
        - /bin/sh
        - -c
        - |
          /usr/bin/python3 /pgadmin4/setup.py --load-servers /pgadmin4/servers.json --user ${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_USERNAME} --password ${EDUTAP_WALLET_APPLE_VAS_WEB_SERVICE_DB_PASSWORD}

  # The fastapi server pushes the callback data to kafka
  kafka:
    container_name: kafka
    image: 'docker.io/bitnami/kafka:latest'
    ports:
      - '9092:9092'
    volumes:
      - "./kafka_data:/bitnami/data"
    environment:
      # KRaft
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERN://:19094,EXTERNAL://:9094                 # Gesamtmenge der Listener
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092,INTERN://kafka:19094,EXTERNAL://127.0.0.1:9094  # Kontaktadressen der Listener
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERN:PLAINTEXT,EXTERNAL:PLAINTEXT # pro Listener, das Auth-Verfahren
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-30300}:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19094
      DYNAMIC_CONFIG_ENABLED: 'true'         # not necessary, added for tests
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui # necessary to set the path to /kafka-ui via traefik, otherwise 404
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka-ui.rule=Host(`${DOMAIN}`) && PathPrefix(`/kafka-ui`)"
      - "traefik.http.routers.kafka-ui.entrypoints=https,http"
      - "traefik.http.routers.kafka-ui.tls.certresolver=le"

  # create the topics
  create-topic:
    image: bitnami/kafka:latest
    container_name: "script-create-topic"
    command: "kafka-topics.sh --create --topic apple-wallet-vas-web-service --if-not-exists --bootstrap-server kafka:19094"
    depends_on:
      - kafka

  traefik:
    image: "traefik:latest"
    container_name: apple-wallet-vas-web-service-traefik
    dns:
      ${DNS:-8.8.8.8}

    depends_on:
      - apple-wallet-vas-web-service
      - kafka-ui

    command:
      - "--providers.file.filename=/traefik.yaml"
      - "--log.level=DEBUG"

    ports:
      - "80:80"
      - "${HTTPS_PORT:-8443}:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt/${DOMAIN}:/letsencrypt"
      - "./traefik.yaml:/traefik.yaml"
